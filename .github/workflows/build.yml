name: Build containers

on:
  push:
    paths:
      - infrastructure/nginx/**
      - infrastructure/grafana/**
      - infrastructure/docker-compose.yml
      - .github/workflows/build.yml
      - apps/backend/**
      - apps/frontend/**
    branches:
      - main

jobs:
  docker-build:
    runs-on: self-hosted
    env:
      IMAGE_TAG: ${{ github.sha }}
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        run: |
          set -e
          ENV_FILE="$HOME/edu_lab/CICD_Lab/infrastructure/.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing $ENV_FILE — create it from .env.example on the server"
            exit 1
          fi
          # Secrets stay on the host; IMAGE_TAG (job env / git SHA) overrides .env
          docker compose --env-file "$ENV_FILE" build nginx grafana hello-app
          docker compose --env-file "$ENV_FILE" up -d nginx grafana hello-app

      - name: Health check nginx 
        run: |
          docker run --rm --network infrastructure_default curlimages/curl:8.21.0 \
           -sf --max-time 10 http://nginx/
          echo "nginx health check passed"

      - name: Health check grafana
        run: |
          docker run --rm --network infrastructure_default curlimages/curl:8.21.0 \
           -sf --max-time 10 http://grafana:3000/login
          echo "grafana health check passed"

      - name: Health check hello app
        run: |
          docker run --rm --network infrastructure_default curlimages/curl:8.21.0 \
            -sf --max-time 10 http://hello-app:5000/health
          echo "test hello-app health check passed"
          
