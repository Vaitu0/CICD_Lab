name: Build containers

on:
  push:
    paths:
      - Infrastructure/nginx/**
      - Infrastructure/grafana/**
      - Infrastructure/docker-compose.yml
      - .github/workflows/build.yml
      - apps/test/**
    branches:
      - main

jobs:
  docker-build:
    runs-on: self-hosted
    env:
      IMAGE_TAG: ${{ github.sha }}
    defaults:
      run:
        working-directory: Infrastructure
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        run: |
          set -e
          cp "$HOME/edu_lab/CICD_Lab/Infrastructure/.env" .env
          docker compose build nginx grafana hello-app
          docker compose up -d nginx grafana hello-app

      - name: Health check nginx 
        run: |
          docker run --rm --network infrastructure_default curlimages/curl:8.21.0 \
           -sf --max-time 10 http://nginx/
          echo "nginx health check passed"

      - name: Health check grafana
        run: |
          docker run --rm --network infrastructure_default curlimages/curl:8.21.0 \
           -sf --max-time 10 http://grafana:3000/login
          echo "grafana health check passed"

      - name: Health check hello app
        run: |
          docker run --rm --network infrastructure_default curlimages/curl:8.21.0 \
            -sf --max-time 10 http://hello-app:5000/health
          echo "test hello-app health check passed"
          
