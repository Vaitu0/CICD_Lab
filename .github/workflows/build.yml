name: Build containers

on:
  push:
    paths:
      - Infrastructure/nginx/**
      - Infrastructure/grafana/**
      - Infrastructure/docker-compose.yml
      - .github/workflows/build.yml
    branches:
      - main

jobs:
  docker-build:
    runs-on: self-hosted
    env:
      IMAGE_TAG: ${{ github.sha }}
    defaults:
      run:
        working-directory: Infrastructure
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
      - run: |
          set -e
          cp "$HOME/edu_lab/CICD_Lab/Infrastructure/.env" .env
          docker pull curlimages/curl:8.21.0
          docker compose build nginx grafana
          docker compose up -d nginx grafana

      - name: Health check nginx 
        run: |
          curl -sf --max-time 10 http://127.0.0.1/ > /dev/null
          echo "nginx health check passed"

      - name: Health check grafana
        run: |
          curl -sf --max-time 10 http://127.0.0.1:3000/login > /dev/null
          echo "grafana health check passed"