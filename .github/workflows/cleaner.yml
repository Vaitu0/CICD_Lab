name: Docker cleaner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

jobs:
    cleaner:
      runs-on: self-hosted
          working-directory: Infrastructure

      steps:
        - name: old images cleaner
          run: |
            docker image prune -af
            echo "images cleaned"

        - name: build cache cleaner    
          run: |
            docker builder prune -f
            echo "build cache cleaned"